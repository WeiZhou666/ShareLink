<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- brand indigo disc, paper plane, nose to top-right -->
  <circle cx="100" cy="100" r="95" fill="#5e6ad2"/>
  <!-- upper wing, large top surface (brightest) -->
