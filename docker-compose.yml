# ShareLink 生产编排：backend-nest（NestJS）+ frontend-vue（Caddy 静态托管/反代）+ 基础设施
#
# 使用前先准备两个文件（模板见 .env.production.example）：
#   1. cp .env.production.example .env   —— compose 变量替换 + backend 容器 env 的唯一来源
#   2. 可选挂载 config.yaml（应用级锁死键），默认注释
#
# 启动：docker compose up -d --build
# 访问：http://localhost:${WEB_PORT:-80}（前端由 Caddy 托管，/api 反代到 backend）
#
# 项目名 sharelink-prod 与开发环境（backend-nest/docker-compose.yml 的 sharelink）隔离：
# 容器名、网络、named volume 互不干扰，可同机共存
name: sharelink-prod

services:
  mysql:
    image: mysql:8.4
    container_name: sharelink-prod-mysql
    restart: unless-stopped
    # 生产不映射宿主机端口：backend 在 compose 网络内以服务名 mysql 直连，
    # 需要外部工具连库时临时放开（security risk 自行评估）
    # ports:
    #   - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_PASS}' ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sharelink-prod-redis
    restart: unless-stopped
    # 认证黑名单（token 即时吊销）存储；内网服务，不对外暴露
    command: [ 'redis-server', '--appendonly', 'yes' ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 20

  # ClamAV 病毒扫描（clamd INSTREAM :3310）：backend 经服务名 clamav 直连。
  # 首次启动 freshclam 下载 ~250MB 病毒库需数分钟，start_period 为其宽限
  # 内存预算 ~1~1.5GB；不部署扫描时删掉本服务，并同步删除 backend.depends_on.clamav
  clamav:
    image: clamav/clamav:latest
    container_name: sharelink-prod-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: [ 'CMD', 'clamdcheck.sh' ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # MinIO 对象存储（S3 兼容）。生产建议改用云厂商 S3/R2 等：
  # 删掉本服务，.env 里 STORAGE_DRIVER=s3 + S3_ENDPOINT 指向真实端点即可
  minio:
    image: bitnamilegacy/minio:latest
    container_name: sharelink-prod-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sharelink}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sharelink2026}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend-nest
    image: sharelink-backend:latest
    container_name: sharelink-prod-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # ---- 服务名映射：覆盖 .env 里面向宿主机开发的 localhost，容器内直连 compose 服务名 ----
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      # ---- 容器内路径 ----
      DATA_DIRECTORY: /opt/app/backend/data
      CONFIG_FILE: /opt/app/config.yaml
      # dotenv 不覆盖已有变量：env_file 提供业务键（JWT_SECRET/CORS_ORIGIN/DB_*/SMTP_*/STORAGE_DRIVER...），
      # 本 environment 段优先级更高
    env_file:
      - path: ./.env
        required: true
    volumes:
      - backend_data:/opt/app/backend/data
      - backend_logs:/opt/app/logs
      # 应用级配置锁死键（appUrl/chunkSize/antivirus.enabled...），可选：
      # - ./config.yaml:/opt/app/config.yaml:ro
      # 生产强约束由 env-loader 校验：JWT_SECRET 强随机、COOKIE_SECURE=true、CORS_ORIGIN 必填

  frontend:
    build: ./frontend-vue
    image: sharelink-frontend:latest
    container_name: sharelink-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Nginx 反代目标（模板 envsubst 注入，compose 网络内服务名）
      BACKEND_HOST: backend:3000
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  mysql_data:
  redis_data:
  clamav_data:
  minio_data:
  backend_data:
  backend_logs:
